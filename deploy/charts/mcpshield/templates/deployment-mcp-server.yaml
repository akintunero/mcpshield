apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpshield.fullname" . }}-mcp-server
  labels:
    app: {{ include "mcpshield.name" . }}
    component: mcp-server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "mcpshield.name" . }}
      component: mcp-server
  template:
    metadata:
      labels:
        app: {{ include "mcpshield.name" . }}
        component: mcp-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mcp-server
          image: "{{ .Values.images.mcpServer.repository }}:{{ .Values.images.mcpServer.tag }}"
          imagePullPolicy: {{ .Values.images.mcpServer.pullPolicy }}
          ports:
            - containerPort: {{ .Values.config.mcpHttpPort }}
              name: mcp
          env:
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel }}
            - name: MCP_HTTP_PORT
              value: "{{ .Values.config.mcpHttpPort }}"
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "mcpshield.fullname" . }}-secrets
                  key: mcp-api-key
            - name: MCPSHIELD_STATE_DIR
              value: /app/.mcpshield-state
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.mcpHttpPort }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.config.mcpHttpPort }}
          resources:
            {{- toYaml .Values.resources.mcpServer | nindent 12 }}
          volumeMounts:
            - name: state
              mountPath: /app/.mcpshield-state
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: {{ include "mcpshield.fullname" . }}-state
