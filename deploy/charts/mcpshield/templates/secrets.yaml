apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcpshield.fullname" . }}-secrets
type: Opaque
data:
  mcp-api-key: {{ .Values.secrets.mcpApiKey | b64enc }}
  api-key: {{ .Values.secrets.apiKey | b64enc }}
  slack-bot-token: {{ .Values.secrets.slackBotToken | b64enc }}
  slack-app-token: {{ .Values.secrets.slackAppToken | b64enc }}
  slack-signing-secret: {{ .Values.secrets.slackSigningSecret | b64enc }}
