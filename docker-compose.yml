name: mcpshield

networks:
  mcpshield:
    name: mcpshield
    driver: bridge

volumes:
  mcpshield-state:
    name: mcpshield-state

x-mcp-env: &mcp-env
  MCP_TRANSPORT: ${MCP_TRANSPORT:-http}
  MCP_API_KEY: ${MCP_API_KEY:-}
  CORS_ORIGINS: ${CORS_ORIGINS:-*}

x-logging: &logging
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NODE_ENV: ${NODE_ENV:-production}

x-default-resources: &default-resources
  mem_limit: 512m
  mem_reservation: 256m

services:
  mcp-server:
    build:
      context: .
      dockerfile: docker/mcp-server/Dockerfile
    container_name: mcpshield-mcp-server
    networks:
      - mcpshield
    ports:
      - '7801:7801'
    volumes:
      - mcpshield-state:/app/.mcpshield-state
    environment:
      <<: [*mcp-env, *logging]
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: 7801
      MCPSHIELD_STATE_DIR: /app/.mcpshield-state
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:7801/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    command: ['sh', '-c', 'chown mcpshield:mcpshield /app/.mcpshield-state 2>/dev/null; exec node /app/apps/mcp-server/dist/index.js']
    restart: unless-stopped
    <<: *default-resources

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: mcpshield-api
    networks:
      - mcpshield
    ports:
      - '7802:7802'
    volumes:
      - mcpshield-state:/app/.mcpshield-state
    env_file:
      - .env
    environment:
      <<: [*mcp-env, *logging]
      MCP_SERVER_URL: http://mcp-server:7801/sse
      API_HOST: 0.0.0.0
      API_PORT: 7802
      MCPSHIELD_STATE_DIR: /app/.mcpshield-state
      API_KEY: ${API_KEY:-}
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:7802/health']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      mcp-server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    restart: unless-stopped
    <<: *default-resources

  agent:
    build:
      context: .
      dockerfile: docker/agent/Dockerfile
    container_name: mcpshield-agent
    networks:
      - mcpshield
    volumes:
      - mcpshield-state:/app/.mcpshield-state
    env_file:
      - .env
    environment:
      <<: [*mcp-env, *logging]
      MCP_SERVER_URL: http://mcp-server:7801/sse
      MCPSHIELD_STATE_DIR: /app/.mcpshield-state
    depends_on:
      mcp-server:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    command: ['sh', '-c', 'chown mcpshield:mcpshield /app/.mcpshield-state 2>/dev/null; exec node /app/apps/agent/dist/index.js']
    restart: unless-stopped
    <<: *default-resources
